hostname edge1
!
ip routing
!
interface Ethernet1
   description site-a -> h1
   no switchport
   ip address 10.1.0.1/24
!
interface Ethernet2
   description ebgp -> r2
   no switchport
   ip address 10.0.0.1/30
!
interface Loopback0
   ip address 1.1.1.1/32
!
router bgp 65001
   router-id 1.1.1.1
   neighbor 10.0.0.2 remote-as 65002
   network 10.1.0.0/24
!
lldp run
!
management api http-commands
   no shutdown
   protocol http
   protocol https
!
username admin privilege 15 role network-admin secret admin
!
end
