! core1.cfg — L3 core. Gateways for VLAN 10/20/30, OSPF transit to core2.
hostname core1
!
vlan 10
   name users
vlan 20
   name servers
vlan 30
   name voice
!
interface Ethernet1
   description trunk -> acc1
   switchport mode trunk
   switchport trunk allowed vlan 10
!
interface Ethernet2
   description trunk -> acc2
   switchport mode trunk
   switchport trunk allowed vlan 20,30
!
interface Ethernet48
   description transit -> core2
   no switchport
   ip address 10.255.0.0/31
   ip ospf network point-to-point
!
interface Loopback0
   ip address 1.1.1.1/32
!
interface Vlan10
   ip address 10.10.10.1/24
interface Vlan20
   ip address 10.10.20.1/24
interface Vlan30
   ip address 10.10.30.1/24
!
ip routing
!
router ospf 1
   router-id 1.1.1.1
   network 1.1.1.1/32 area 0
   network 10.10.0.0/16 area 0
   network 10.255.0.0/31 area 0
   max-lsa 12000
!
lldp run
!
snmp-server community nocflow ro
!
management api http-commands
   no shutdown
   protocol http
   protocol https
!
username admin privilege 15 role network-admin secret admin
!
end
